name: CI

on:
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable

      - name: Check version bumps for changed workspaces
        run: BASE_REF="origin/${{ github.base_ref }}" yarn check-version

      - run: yarn build
      - run: yarn test
